name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        # Review R8: the project is developed and demonstrated on Windows as
        # well, so Windows joins the matrix instead of Ubuntu-only CI.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (coverage floor enforced via pyproject fail_under)
        run: pytest -q --cov=packages --cov-report=term-missing
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy packages apps

  build:
    # Review R8: wheel build + content smoke for the `packages` layout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tool
        run: python -m pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Wheel content smoke
        run: python scripts/check_wheel.py dist
